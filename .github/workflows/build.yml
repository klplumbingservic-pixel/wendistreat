name: Build & Deploy Check

# Runs on every push and pull request so build errors are caught
# before changes reach Cloudflare's GitHub-connected Pages build.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build Vite site (Node 20)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: List build output
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::Build completed but dist/index.html is missing — check the Vite build configuration."
            exit 1
          fi
          echo "Build output (dist):"
          ls -R dist | head -50

      - name: Report build errors
        if: failure()
        run: |
          echo "## ❌ Build failed" >> $GITHUB_STEP_SUMMARY
          echo "The Vite build failed on Node.js 20. This same error would block the Cloudflare Pages deployment." >> $GITHUB_STEP_SUMMARY
          echo "Check the failing step's logs above for the exact TypeScript or bundling error." >> $GITHUB_STEP_SUMMARY
